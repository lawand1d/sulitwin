<!DOCTYPE html>
<html lang="en">
<head>
  <title>Display buildings in 3D</title>
  <meta charset='utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css' />
  
  <link rel='stylesheet' href='styles.css' />

</head>
<body>
<div id="map"></div>
<div id="visibility-overlay"></div>

<div id="info" style="
  position:absolute; top:10px; left:10px; z-index:3;
  background:rgba(255,255,255,0.85); padding:8px 12px;
  font:12px/1.5 monospace; border-radius:4px; white-space:pre;
  pointer-events:none;"></div>

<div id="traffic-panel">
  <div class="traffic-header">
    <span>🚗 Traffic</span>
    <span id="traffic-count">0</span>
  </div>
  <input type="range" id="traffic-slider" min="0" max="200" value="0" step="1" />
  <div class="traffic-info"><span id="traffic-roads">0</span> road segments</div>
</div>

<div id="weather" style="
  position:absolute; top:10px; right:10px; z-index:3;
  background:rgba(255,255,255,0.92); padding:10px 14px;
  font:13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.25);
  min-width:170px; color:#1a1f2e;">
  <div style="font-weight:600; font-size:11px; letter-spacing:0.5px;
              color:#6b7280; text-transform:uppercase; margin-bottom:4px;">Weather</div>
  <div id="weather-body" style="display:flex; align-items:center; gap:10px;">
    <div id="weather-icon" style="font-size:28px; line-height:1;">⏳</div>
    <div>
      <div id="weather-temp" style="font-size:18px; font-weight:600;">—°C</div>
      <div id="weather-desc" style="font-size:11px; color:#6b7280;">Loading…</div>
    </div>
  </div>
  <div id="weather-extra" style="margin-top:6px; font-size:11px; color:#6b7280;
       border-top:1px solid #e5e7eb; padding-top:6px;"></div>
</div>

<div id="map-tools">
  <button id="building-build-btn" type="button">🏗️ Build building</button>
  <button id="building-delete-btn" type="button">🗑️ Delete building</button>
  <button id="building-edit-btn" type="button">✏️ Edit buildings</button>
  <button id="road-draw-btn" type="button">🛣️ Draw road</button>
  <button id="road-delete-btn" type="button">🗑️ Delete road</button>
  <button id="zone-draw-btn" type="button">⭕ Draw zone</button>
  <button id="zone-delete-btn" type="button">🗑️ Delete zone</button>
  <button id="ao-toggle-btn" type="button">🌑 Shadows ON</button>
  <button id="tile-picker-btn" type="button">
    🎯 Pick tiles<span id="tile-picker-count"></span>
  </button>
</div>

<div id="prompt-container">
  <div id="prompt-log"></div>
  <div id="prompt-bar">
    <input id="prompt-input" type="text" autocomplete="off"
      placeholder='Try: build building 20m 45.443,35.557 … · traffic 50 · help' />
    <button id="prompt-send" type="button">Send</button>
  </div>
</div>

<div id="height-panel" class="hidden">
  <div id="height-panel-header">Building height</div>
  <div class="height-panel-row">
    <input id="height-input" type="number" min="1" max="500" step="1" value="20" />
    <span class="height-panel-unit">m</span>
  </div>
  <div class="height-panel-actions">
    <button id="height-cancel" type="button">Cancel</button>
    <button id="height-ok" type="button">Create building</button>
  </div>
</div>

<div id="zone-class-panel" class="hidden">
  <div id="zone-class-panel-header">Zone class</div>
  <div class="zone-class-buttons">
    <button class="zone-class-btn" data-class="Flood" type="button">Flood</button>
    <button class="zone-class-btn" data-class="Green" type="button">Green</button>
    <button class="zone-class-btn" data-class="Shade" type="button">Shade</button>
  </div>
  <div class="zone-class-actions">
    <button id="zone-class-cancel" type="button">Cancel</button>
  </div>
</div>

<div id="status">
  <div id="status-header">
    <span class="title">Debug</span>
    <button id="status-toggle" type="button">Expand</button>
  </div>
  <div id="status-body">Ready.</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
